# Compliance Agent configuration
# Editable without touching code — supports policy versioning.
# Mirrors credit_config.yaml's pattern: app.compliance.config falls back to
# identical in-code defaults if this file is missing.

required_kyc_documents:
  - PAN
  - AADHAAR
  - ADDRESS_PROOF

fuzzy_match:
  # rapidfuzz token_sort_ratio threshold (0-100) for name matching across
  # documents extracted by the Document Ingestion Agent.
  name_match_threshold: 90

pmla_aml:
  require_source_of_funds_declaration: true
  require_identity_verification_log: true

nhb_priority_sector:
  # Loan amount ceilings (INR) for priority-sector housing loan
  # classification. PLACEHOLDER values for Phase 1 — replace with the exact
  # NHB circular figures once sourced.
  metro_ceiling: 3500000
  non_metro_ceiling: 2500000

rera:
  required_for_under_construction: true

protected_attributes:
  # Must never be used in per-decision logic (RBI Fair Practices Code).
  - religion
  - caste
  - gender
  - region

confidence:
  base: 0.90
  critical_flag_penalty: 0.15
  warning_flag_penalty: 0.05
  floor: 0.30
